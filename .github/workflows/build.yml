name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-1-21-4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Build
        run: gradle build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: auto-spawner-mob-attack-1.21.4
          path: build/libs/*.jar

  build-1-21-11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Build
        working-directory: mc-1.21.11
        run: gradle build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: auto-spawner-mob-attack-1.21.11
          path: mc-1.21.11/build/libs/*.jar
