name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: '1.20.4', dir: 'mc-1.20.4', gradle: '8.12', java: '21' }
          - { name: '1.20.6', dir: 'mc-1.20.6', gradle: '8.12', java: '21' }
          - { name: '1.21.1', dir: 'mc-1.21.1', gradle: '8.12', java: '21' }
          - { name: '1.21.3', dir: 'mc-1.21.3', gradle: '8.12', java: '21' }
          - { name: '1.21.4', dir: '.', gradle: '8.12', java: '21' }
          - { name: '1.21.5', dir: 'mc-1.21.5', gradle: '9.2.1', java: '21' }
          - { name: '1.21.8', dir: 'mc-1.21.8', gradle: '9.2.1', java: '21' }
          - { name: '1.21.10', dir: 'mc-1.21.10', gradle: '9.2.1', java: '21' }
          - { name: '1.21.11', dir: 'mc-1.21.11', gradle: '9.2.1', java: '21' }
          - { name: '26.1.2', dir: 'mc-26.1', gradle: '9.4.0', java: '25' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Build
        working-directory: ${{ matrix.dir }}
        run: |
          set +e
          gradle build --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E "error:|What went wrong|Could not|Caused by|symbol:|location:|Unsupported|not found|FAILURE" -A1 build.log | grep -v "^--" | head -60 | cut -c1-220 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=build-errors::${msg}"
          fi
          tail -30 build.log
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: auto-spawner-mob-attack-${{ matrix.name }}
          path: ${{ matrix.dir }}/build/libs/*.jar
